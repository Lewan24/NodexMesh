services:
  db:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

  api:
    environment:
      ConnectionStrings__Default: ""
      Jwt__Key: ""
    secrets:
      - postgres_password
      - jwt_key

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  jwt_key:
    file: ./secrets/jwt_key.txt
