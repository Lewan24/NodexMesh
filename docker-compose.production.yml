# Standalone Docker Compose / Portainer stack (Docker Standalone endpoint).
# Replace the two database password values, JWT key and public origin below.
# Route HTTPS from your reverse proxy to the Docker host on port 3000.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: nodexmesh
      POSTGRES_USER: nodexmesh_app
      POSTGRES_PASSWORD: 'CHANGE-ME-database-password'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nodexmesh_app", "-d", "nodexmesh"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      nodexmesh_app:
        ipv4_address: 172.30.0.12

  api:
    image: lewan24/nodexmesh-api:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    environment:
      Library__Path: ${LIBRARY_PATH:-/app/storage/library}
      Library__MaxFileBytes: ${LIBRARY_MAX_FILE_BYTES:-52428800}
      Library__MaxProjectBytes: ${LIBRARY_MAX_PROJECT_BYTES:-1073741824}
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Keep this password identical to POSTGRES_PASSWORD above.
      ConnectionStrings__Default: 'Host=db;Port=5432;Database=nodexmesh;Username=nodexmesh_app;Password=CHANGE-ME-database-password'
      # Replace with a random secret of at least 32 characters.
      Jwt__Key: 'CHANGE-ME-with-a-random-JWT-key-at-least-32-characters'
      Jwt__Issuer: nodexmesh-api
      Jwt__Audience: nodexmesh-web
      # Public browser origin, without a trailing slash.
      Cors__AllowedOrigins__0: https://nodexmesh.example.com
      Admin__Email: admin@nodexmesh.pl
      # Supply securely before first startup; passwords are never generated into logs.
      Admin__Password: ''
      # Optional SMTP override. Leave Email__Host empty to configure encrypted settings in the admin panel.
      Email__Enabled: ${EMAIL_ENABLED:-false}
      Email__Host: ${EMAIL_HOST:-}
      Email__Port: ${EMAIL_PORT:-587}
      Email__UseSsl: ${EMAIL_USE_SSL:-true}
      Email__Username: ${EMAIL_USERNAME:-}
      Email__Password: ${EMAIL_PASSWORD:-}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-}
      Email__FromName: ${EMAIL_FROM_NAME:-NodexMesh}
      Email__PublicBaseUrl: ${EMAIL_PUBLIC_BASE_URL:-https://nodexmesh.example.com}
      Email__UserNotificationsEnabled: ${EMAIL_USER_NOTIFICATIONS_ENABLED:-true}
      Email__AdminAlertsEnabled: ${EMAIL_ADMIN_ALERTS_ENABLED:-true}
      DataProtection__KeysPath: /app/keys
      # The API receives requests from the frontend Nginx container only.
      # Keep this address stable; do not replace it with 0.0.0.0/0.
      ReverseProxy__KnownProxies__0: 172.30.0.10
      ReverseProxy__ForwardLimit: 1

    volumes:
      - library-data:/app/storage
      - data-protection-keys:/app/keys
    networks:
      nodexmesh_app:
        ipv4_address: 172.30.0.11

  frontend:
    image: lewan24/nodexmesh-web:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      nodexmesh_app:
        ipv4_address: 172.30.0.10

volumes:
  data-protection-keys:
  library-data:
  postgres-data:

networks:
  nodexmesh_app:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
