# Trust only the configured edge proxy; never browser-supplied forwarding headers.
geo $realip_remote_addr $trusted_edge {
  default 0;
  ${TRUSTED_EDGE_CIDR} 1;
}
map "$trusted_edge:$http_x_forwarded_proto" $client_scheme {
  default $scheme;
  "1:https" https;
  "1:http" http;
}
server {
  listen 8080;
  server_name _;
  set_real_ip_from ${TRUSTED_EDGE_CIDR};
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Every page, static asset, API and hub handshake is gated before serving content.
  auth_request /_ip_access;
  location = /_ip_access {
    internal;
    auth_request off;
    proxy_pass http://api:8080/api/v1/security/ip-check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $client_scheme;
  }

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

  # Match the default API library limit; raise this when Library__MaxFileBytes increases.
  client_max_body_size 50m;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $client_scheme;
  }

  location /hubs/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $client_scheme;
  }

  # Only actual application routes receive the SPA. Unknown paths (including
  # scanner probes) reach the API's 404 handler and durable audit middleware.
  location = / {
    try_files /index.html =404;
  }

  location ~ ^/shared/[^/]+/?$ {
    try_files /index.html =404;
  }

  location / {
    try_files $uri @audit_missing;
  }

  location @audit_missing {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $client_scheme;
  }
}
