server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

  # Match the default API library limit; raise this when Library__MaxFileBytes increases.
  client_max_body_size 50m;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Nginx Proxy Manager is the trusted edge and must replace browser-supplied
    # forwarding headers. Forward its sanitized single-client value unchanged;
    # appending this container would make the API record NPM instead of the client.
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    # Nginx Proxy Manager terminates TLS. Preserve its verified original scheme;
    # using this container's $scheme would make HTTPS requests look like HTTP.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /hubs/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
