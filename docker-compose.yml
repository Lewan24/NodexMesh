services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nodexmesh}
      POSTGRES_USER: ${POSTGRES_USER:-nodexmesh_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    # Keep PostgreSQL private to the Compose network. Uncomment for local GUI access.
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - nodexmesh_app

  api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
      no_cache: true
    # Future Docker Hub deployment: use this image instead of the build block.
    # image: lewan24/nodexmesh-api:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Development keeps the local HTTP stack from redirecting to HTTPS. Set
      # Production when TLS is terminated by an external reverse proxy.
      Library__Path: ${LIBRARY_PATH:-/app/storage/library}
      Library__MaxFileBytes: ${LIBRARY_MAX_FILE_BYTES:-52428800}
      Library__MaxProjectBytes: ${LIBRARY_MAX_PROJECT_BYTES:-1073741824}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-nodexmesh};Username=${POSTGRES_USER:-nodexmesh_app};Password=${POSTGRES_PASSWORD:-}
      Jwt__Key: ${JWT_KEY:-}
      Jwt__Issuer: ${JWT_ISSUER:-http://localhost:8080}
      Jwt__Audience: ${JWT_AUDIENCE:-nodexmesh-web}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:3000}
      Admin__Email: ${ADMIN_EMAIL:-admin@example.com}
      Admin__Password: ${ADMIN_PASSWORD:-}
      Email__Enabled: ${EMAIL_ENABLED:-false}
      Email__Host: ${EMAIL_HOST:-}
      Email__Port: ${EMAIL_PORT:-587}
      Email__UseSsl: ${EMAIL_USE_SSL:-true}
      Email__Username: ${EMAIL_USERNAME:-}
      Email__Password: ${EMAIL_PASSWORD:-}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-}
      Email__FromName: ${EMAIL_FROM_NAME:-NodexMesh}
      Email__PublicBaseUrl: ${EMAIL_PUBLIC_BASE_URL:-}
      Email__UserNotificationsEnabled: ${EMAIL_USER_NOTIFICATIONS_ENABLED:-true}
      Email__AdminAlertsEnabled: ${EMAIL_ADMIN_ALERTS_ENABLED:-true}
      DataProtection__KeysPath: /app/keys
      ReverseProxy__KnownProxies__0: 172.31.0.10
      ReverseProxy__ForwardLimit: 1
      RateLimiting__IpRequestsPerMinute: ${RATE_LIMIT_IP_PER_MINUTE:-2000}
      RateLimiting__UserRequestsPerMinute: ${RATE_LIMIT_USER_PER_MINUTE:-1000}
      RateLimiting__AuthRequestsPerMinute: ${RATE_LIMIT_AUTH_PER_MINUTE:-5}
      RateLimiting__RefreshRequestsPerMinute: ${RATE_LIMIT_REFRESH_PER_MINUTE:-120}
      RateLimiting__GateRequestsPerMinute: ${RATE_LIMIT_GATE_PER_MINUTE:-10000}
      IpProtection__Enabled: ${IP_PROTECTION_ENABLED:-true}
      IpProtection__WindowMinutes: ${IP_PROTECTION_WINDOW_MINUTES:-10}
      IpProtection__BanMinutes: ${IP_PROTECTION_BAN_MINUTES:-60}
      IpProtection__FailedLoginThreshold: ${IP_FAILED_LOGIN_THRESHOLD:-10}
      IpProtection__UnauthorizedThreshold: ${IP_UNAUTHORIZED_THRESHOLD:-100}
      IpProtection__NotFoundThreshold: ${IP_NOT_FOUND_THRESHOLD:-100}
      IpProtection__BanOnRateLimit: ${IP_BAN_ON_RATE_LIMIT:-false}
      IpProtection__RateLimitThreshold: ${IP_RATE_LIMIT_THRESHOLD:-100}
      # Optional exact client addresses. Empty values are ignored; proxy trust is separate.
      IpProtection__Allowlist__0: ${FRIENDLY_IP_1:-}
      IpProtection__Allowlist__1: ${FRIENDLY_IP_2:-}
    ports:
      - "${API_PORT:-8080}:8080"

    volumes:
      - library-data:/app/storage
      - data-protection-keys:/app/keys

    networks:
      nodexmesh_app:
        ipv4_address: 172.31.0.11

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      no_cache: true
      args:
        VITE_DATA_SOURCE: ${VITE_DATA_SOURCE:-http}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    # Future Docker Hub deployment: use this image instead of the build block.
    # image: lewan24/nodexmesh-web:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-3000}:8080"

    environment:
      TRUSTED_EDGE_CIDR: ${TRUSTED_EDGE_CIDR:-127.0.0.1/32}
    networks:
      nodexmesh_app:
        ipv4_address: 172.31.0.10

  adminer:
    image: adminer:4.8.1-standalone
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    networks:
      - nodexmesh_app

volumes:
  data-protection-keys:
  library-data:
  postgres-data:

networks:
  nodexmesh_app:
    ipam:
      config:
        - subnet: 172.31.0.0/24
